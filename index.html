<style>
/* ===================== 设计令牌（配色体系保持不变） ===================== */
:root{
  --accent: oklch(0.72 0.19 152);
  --accent-strong: oklch(0.60 0.19 152);
  --accent-soft: oklch(0.72 0.19 152 / 0.12);

  --bg: oklch(0.975 0.006 160);
  --bg-header: oklch(0.995 0.003 160);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.955 0.008 160);
  --surface-3: oklch(0.925 0.010 160);

  --text: oklch(0.22 0.02 160);
  --text-2: oklch(0.48 0.015 160);
  --text-3: oklch(0.62 0.01 160);
  --line: oklch(0.90 0.008 160);

  --shadow: 0 1px 2px oklch(0.2 0.02 160 / 0.06), 0 8px 24px oklch(0.2 0.02 160 / 0.07);
  --shadow-lift: 0 2px 4px oklch(0.2 0.02 160 / 0.08), 0 16px 40px oklch(0.2 0.02 160 / 0.12);

  --radius: 14px;
  --radius-lg: 18px;
  --sidebar-w: 236px;
  --player-h: 84px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="dark"]{
  --accent: oklch(0.78 0.19 152);
  --accent-strong: oklch(0.85 0.19 152);
  --accent-soft: oklch(0.78 0.19 152 / 0.14);

  --bg: oklch(0.145 0.004 160);
  --bg-header: oklch(0.115 0.004 160);
  --surface: oklch(0.20 0.006 160);
  --surface-2: oklch(0.24 0.006 160);
  --surface-3: oklch(0.28 0.008 160);

  --text: oklch(0.93 0.005 160);
  --text-2: oklch(0.70 0.01 160);
  --text-3: oklch(0.54 0.01 160);
  --line: oklch(0.30 0.008 160);

  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.35);
  --shadow-lift: 0 2px 4px oklch(0 0 0 / 0.4), 0 16px 40px oklch(0 0 0 / 0.5);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  transition:background .45s var(--ease), color .45s var(--ease);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}
svg{display:block}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--accent);color:#fff}

/* ===================== 整体骨架：侧边栏 + 主区 + 播放条 ===================== */
.app{height:100dvh;display:flex;flex-direction:column}
.app-body{flex:1;display:flex;min-height:0}

/* ===================== 侧边栏 ===================== */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg-header);border-right:1px solid var(--line);
  transition:background .45s var(--ease), border-color .45s var(--ease), transform .35s var(--ease);
  z-index:80;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
.brand .logo svg{width:17px;height:17px;stroke:#fff;stroke-width:2.2}
[data-theme="dark"] .brand .logo svg{stroke:oklch(0.15 0.02 160)}
.brand .name{font-size:15px;font-weight:800;letter-spacing:.5px;line-height:1.3}
.brand .name small{display:block;font-size:10px;font-weight:500;color:var(--text-3);letter-spacing:1px}

.side-nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.side-nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  font-size:14px;color:var(--text-2);text-decoration:none;transition:all .2s var(--ease);
}
.side-nav a .icon{width:18px;height:18px;flex-shrink:0}
.side-nav a:hover{color:var(--text);background:var(--surface-2)}
.side-nav a.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.side-nav .count{
  margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-3);
  border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums;
}
.side-nav a.active .count{background:var(--accent);color:#fff}
[data-theme="dark"] .side-nav a.active .count{color:oklch(0.15 0.02 160)}

.side-group{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 8px;font-size:12px;color:var(--text-3);letter-spacing:.5px;
}
.side-group .add{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-3);transition:all .2s;
}
.side-group .add:hover{background:var(--surface-2);color:var(--accent-strong)}
.side-group .add svg{width:14px;height:14px}
.side-playlists{flex:1;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:1px;min-height:60px}
.side-pl{
  display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;
  font-size:13px;color:var(--text-2);text-align:left;transition:all .2s;width:100%;
  white-space:nowrap;overflow:hidden;
}
.side-pl .icon{width:15px;height:15px;flex-shrink:0;opacity:.7}
/* 默认歌单星标 */
.side-pl .star{width:14px;height:14px;flex-shrink:0;color:var(--accent-strong);fill:currentColor;stroke:none}
.side-pl.default .icon{opacity:1}
.side-pl:hover{background:var(--surface-2);color:var(--text)}
.side-pl.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.side-pl span:first-of-type{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.side-pl .pl-count{font-size:11px;color:var(--text-3);flex-shrink:0}
.side-empty{padding:10px 14px;font-size:12px;color:var(--text-3)}

.side-foot{
  padding:12px 14px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.side-foot .spacer{flex:1}
.side-foot button{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);transition:all .2s;position:relative;
}
.side-foot button:hover{background:var(--surface-2);color:var(--text)}
.side-foot .icon{width:18px;height:18px}
.lang-btn{width:auto !important;padding:0 9px;font-size:12px;font-weight:700}
.theme-toggle .icon-sun,.theme-toggle .icon-moon{position:absolute;transition:transform .5s var(--ease),opacity .3s}
[data-theme="light"] .icon-sun{opacity:0;transform:rotate(90deg) scale(.4)}
[data-theme="light"] .icon-moon{opacity:1;transform:none}
[data-theme="dark"] .icon-sun{opacity:1;transform:none}
[data-theme="dark"] .icon-moon{opacity:0;transform:rotate(-90deg) scale(.4)}

.side-overlay{
  display:none;position:fixed;inset:0;z-index:75;
  background:oklch(0.15 0.02 160 / 0.45);backdrop-filter:blur(2px);
}

/* ===================== 主区 ===================== */
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}

/* 顶部搜索行 */
.topbar{
  flex-shrink:0;padding:12px 22px;border-bottom:1px solid var(--line);
  background:color-mix(in oklab, var(--bg-header) 90%, transparent);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  transition:background .45s var(--ease), border-color .45s var(--ease);
}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;place-items:center;color:var(--text-2);flex-shrink:0}
.menu-btn:hover{background:var(--surface-2)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:560px;display:flex;align-items:center}
.search-box{
  flex:1;min-width:0;max-width:none;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:0 5px 0 15px;height:40px;transition:border-color .25s, box-shadow .25s;
}
/* 搜索下拉面板 */
.search-panel{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:90;display:none;
  max-height:min(66vh,540px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lift);padding:14px;
}
.search-panel.show{display:block;animation:pop .25s var(--ease)}
.sp-section+.sp-section{margin-top:16px}
.sp-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:13px;font-weight:700;flex-wrap:wrap}
.sp-head .hint{font-weight:400;font-size:12px;color:var(--text-3)}
.sp-spacer{flex:1}
.sp-head .btn-ghost{height:28px;padding:0 10px;font-size:12px}

/* 推荐加载态 */
.rec-loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:40px 20px;font-size:13px;color:var(--text-3);
}
.rec-spin{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--accent-soft);border-top-color:var(--accent);
  animation:recspin .8s linear infinite;
}
@keyframes recspin{to{transform:rotate(360deg)}}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box svg{color:var(--text-3);width:17px;height:17px;flex-shrink:0}
.search-box input{flex:1;border:none;background:none;outline:none;color:var(--text);font-size:14px;min-width:0}
.search-box input::placeholder{color:var(--text-3)}
.btn-primary{
  height:32px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;flex-shrink:0;
  transition:transform .2s var(--ease), box-shadow .2s, filter .2s;
}
[data-theme="dark"] .btn-primary{color:oklch(0.15 0.02 160)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px oklch(0.6 0.19 152 / 0.35);filter:brightness(1.05)}
.source-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--text-2);
  cursor:pointer;transition:all .2s;user-select:none;
}
.chip input{display:none}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);transition:background .2s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.chip.on .dot{background:var(--accent)}
.chip[data-source="netease"].on .dot{background:#e0343c}
.chip[data-source="qq"].on .dot{background:#31c27c}
.chip[data-source="kuwo"].on .dot{background:#ff9a2e}
.chip[data-source="joox"].on .dot{background:#2f7ef7}
.limit-select{
  height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);padding:0 9px;font-size:12px;cursor:pointer;
}
.search-meta{font-size:12px;color:var(--text-3);white-space:nowrap}
.search-meta b{color:var(--accent-strong);font-variant-numeric:tabular-nums}

/* 滚动主区 */
main{flex:1;overflow-y:auto;padding:6px 26px 40px;scroll-behavior:smooth}
.view{max-width:960px;margin:0 auto}
.view[hidden]{display:none}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:19px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.section-head .hint{font-size:13px;font-weight:400;color:var(--text-3)}
.section-actions{display:flex;align-items:center;gap:8px}
.btn-ghost{
  height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;
}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
.btn-ghost .icon{width:15px;height:15px}
.btn-danger:hover{color:#f43f5e;border-color:#f43f5e;background:oklch(0.63 0.24 17 / 0.1)}

.empty{
  border:1px dashed var(--line);border-radius:var(--radius-lg);padding:36px 24px;
  text-align:center;color:var(--text-3);font-size:14px;background:var(--surface);
}
.empty .big{font-size:30px;margin-bottom:10px}

/* 卡片行 */
.card-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px}
.m-card{cursor:pointer;position:relative;min-width:0}
.m-cover{
  position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;
  background:var(--surface-2);box-shadow:var(--shadow);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.m-card:hover .m-cover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.m-cover img{width:100%;height:100%;object-fit:cover;display:block}
.m-cover .ph{
  position:absolute;inset:0;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
}
.m-progress{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);border-radius:0 3px 3px 0}
.m-badge{
  position:absolute;top:9px;right:9px;font-size:11px;font-weight:700;
  background:oklch(0.2 0.02 160 / 0.55);color:#fff;padding:2px 8px;border-radius:999px;
  backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;
}
.m-count{
  position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;color:#fff;background:oklch(0.2 0.02 160 / 0.5);
  padding:2px 8px;border-radius:999px;backdrop-filter:blur(6px);
}
.m-count svg{width:11px;height:11px;fill:#fff;stroke:none}
.play-fab{
  position:absolute;right:9px;bottom:11px;width:38px;height:38px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  opacity:0;transform:translateY(8px);transition:all .3s var(--ease);
  box-shadow:0 6px 16px oklch(0.6 0.19 152 / 0.45);
}
[data-theme="dark"] .play-fab{color:oklch(0.15 0.02 160)}
.m-card:hover .play-fab{opacity:1;transform:none}
.play-fab svg{width:16px;height:16px;fill:currentColor;stroke:none}
.m-card.playing .play-fab{opacity:1;transform:none;background:var(--surface);color:var(--accent-strong)}
.m-title{margin-top:9px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sub{margin-top:3px;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;vertical-align:-2px}
.eq i{width:3px;background:var(--accent-strong);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* 歌曲列表 */
.track-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.track-row{
  display:grid;grid-template-columns:36px 48px minmax(0,1fr) minmax(0,160px) 118px 100px;
  align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);
  transition:background .2s;cursor:pointer;
}
.track-row:last-child{border-bottom:none}
.track-row:hover{background:var(--surface-2)}
.track-row.playing{background:var(--accent-soft)}
.t-index{font-size:14px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;text-align:center}
.track-row:nth-child(-n+3) .t-index{color:var(--accent-strong)}
.t-cover{
  width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--surface-2);
  display:grid;place-items:center;font-size:21px;flex-shrink:0;
}
.t-cover img{width:100%;height:100%;object-fit:cover}
.t-main{min-width:0}
.t-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-album{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--line);white-space:nowrap;
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.pill .dot.netease{background:#e0343c}
.pill .dot.qq{background:#31c27c}
.pill .dot.kuwo{background:#ff9a2e}
.pill .dot.joox{background:#2f7ef7}
.pill.quality{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.t-actions{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.t-act{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);transition:all .2s}
.t-act .icon{width:16px;height:16px}
.t-act:hover{background:var(--surface-3);color:var(--text);transform:scale(1.08)}
.t-act.fav-on{color:#f43f5e}
.t-act.fav-on svg{fill:currentColor}

/* 热门关键词 */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.kw-chip{
  padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;color:var(--text-2);transition:all .22s var(--ease);
}
.kw-chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);transform:translateY(-2px)}

/* 歌单管理 */
.manager{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.manager-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pl-select{flex:1;min-width:170px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:0 10px;cursor:pointer}
.pl-name{
  flex:1;min-width:190px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);padding:0 12px;outline:none;
}
.pl-name:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 弹窗 */
.modal{
  position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  background:oklch(0.15 0.02 160 / 0.5);backdrop-filter:blur(4px);padding:24px;
}
.modal.show{display:flex;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lift);
  animation:pop .3s var(--ease);max-height:86vh;overflow:auto;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-card h3{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-card p{font-size:13px;color:var(--text-3);margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.kbd-list{display:flex;flex-direction:column;gap:10px}
.kbd-row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;color:var(--text-2)}
kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;padding:2px 7px;color:var(--text);
}

/* ===================== 正在播放（大封面 + 居中歌词） ===================== */
.view-np{height:100%;display:flex;flex-direction:column}
/* 小屏播放页左上角的返回按钮（仅 ≤900px 显示，见媒体查询） */
.np-back{
  display:none;align-items:center;gap:5px;color:var(--text-2);font-size:13px;
  padding:8px 0;flex-shrink:0;
}
.np-back:hover{color:var(--text)}
.np-back:active{transform:scale(.96)}
.np-stage{flex:1;display:flex;align-items:stretch;justify-content:center;gap:56px;min-height:0;padding:12px 0 8px}
.np-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex-shrink:0;width:340px}
.np-cover-big{
  width:min(320px,34vh);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--surface-2),var(--surface-3));
  display:grid;place-items:center;font-size:84px;
  box-shadow:0 24px 60px oklch(0.2 0.02 160 / 0.25),
             0 0 0 10px color-mix(in oklab, var(--surface) 60%, transparent),
             0 0 0 11px color-mix(in oklab, var(--line) 70%, transparent);
}
.np-cover-big img{width:100%;height:100%;object-fit:cover;display:block}
.np-cover-big.spinning img{animation:spin 22s linear infinite}
/* 唱片中心孔（容器不旋转，所以固定不动） */
.np-cover-big::after{
  content:"";position:absolute;left:50%;top:50%;width:15%;height:15%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);
  opacity:0;transition:opacity .4s var(--ease);
}
.np-cover-big.spinning::after{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.np-name-big{
  font-size:22px;font-weight:800;text-align:center;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist-big{font-size:14px;color:var(--text-3);text-align:center;margin-top:-8px}
.np-tags-big{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}

.np-right{flex:1;min-width:0;display:flex;flex-direction:column;max-width:520px}
.lyrics-body{
  flex:1;overflow-y:auto;text-align:center;padding:18% 12px 45%;
  scroll-behavior:smooth;mask-image:linear-gradient(transparent, #000 18%, #000 82%, transparent);
  -webkit-mask-image:linear-gradient(transparent, #000 18%, #000 82%, transparent);
}
.lyrics-title{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text-2)}
.lyrics-line{padding:9px 0;font-size:15px;color:var(--text-3);transition:color .35s, transform .35s}
.lyrics-line.active{color:var(--text);font-weight:700;font-size:17px;transform:scale(1.03)}
.lyrics-empty{font-size:13px;color:var(--text-3);padding:30px 0}

/* ===================== 底部播放条 ===================== */
.player{
  flex-shrink:0;height:var(--player-h);position:relative;z-index:70;
  background:color-mix(in oklab, var(--bg-header) 93%, transparent);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  transition:background .45s var(--ease), border-color .45s var(--ease);
}
.mini-progress{position:absolute;top:-1px;left:0;height:2px;background:var(--accent);width:0%;transition:width .25s linear}
.player-inner{
  height:100%;padding:0 20px;display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(320px,2fr) minmax(150px,1fr);
  align-items:center;gap:20px;
}
.np{display:flex;align-items:center;gap:13px;min-width:0;cursor:pointer;border-radius:12px;padding:4px 6px 4px 0}
.np:hover{background:var(--surface-2)}
.np-cover{
  width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:var(--shadow);
}
.np-cover img{width:100%;height:100%;object-fit:cover;display:block}
.np-info{min-width:0}
.np-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tags{display:flex;gap:5px;margin-top:4px;align-items:center}
.np-status{font-size:11px;color:var(--accent-strong);font-weight:600}

.p-center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.controls{display:flex;align-items:center;gap:16px}
.ctrl{color:var(--text-2);transition:all .2s;display:grid;place-items:center;padding:2px}
.ctrl:hover{color:var(--text);transform:scale(1.1)}
.ctrl .icon{width:19px;height:19px}
.ctrl-main{
  width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;transition:transform .25s var(--ease);
  box-shadow:0 4px 14px oklch(0.6 0.19 152 / 0.4);
}
[data-theme="dark"] .ctrl-main{color:oklch(0.15 0.02 160)}
.ctrl-main:hover{transform:scale(1.08)}
.ctrl-main svg{width:17px;height:17px;fill:currentColor;stroke:none}
.progress-row{display:flex;align-items:center;gap:10px;width:100%;max-width:520px}
.time{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;width:38px;flex-shrink:0}
.time.right{text-align:left}
.p-track{flex:1;height:4px;border-radius:99px;background:var(--surface-2);cursor:pointer;position:relative}
.p-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));width:0%}
.p-thumb{
  position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
  background:var(--accent-strong);border:2px solid var(--bg-header);
  transform:translate(-50%,-50%) scale(0);transition:transform .2s var(--ease);box-shadow:var(--shadow);
}
.p-track:hover .p-thumb{transform:translate(-50%,-50%) scale(1)}
.p-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.volume-wrap{display:flex;align-items:center;gap:7px}
.vol-track{width:78px;height:4px;border-radius:99px;background:var(--surface-2);position:relative;cursor:pointer}
.vol-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--text-2);width:70%}
.ctrl.on{color:var(--accent-strong)}
/* 歌词按钮：带文字标签，明确可点击切换 */
.ctrl-lyrics{
  width:auto;height:30px;padding:0 11px;border-radius:999px;gap:6px;
  border:1px solid var(--line);background:transparent;
  display:inline-flex;align-items:center;font-size:12px;font-weight:600;
}
.ctrl-lyrics .icon{width:16px;height:16px}
.ctrl-lyrics .ctrl-label{white-space:nowrap;line-height:1}
.ctrl-lyrics:hover:not(.ctrl-main){transform:none;color:var(--accent-strong);border-color:var(--accent);background:var(--accent-soft)}
.ctrl-lyrics.on{color:#fff;background:var(--accent);border-color:var(--accent)}
[data-theme="dark"] .ctrl-lyrics.on{color:oklch(0.15 0.02 160)}
.ctrl.fav-on{color:#f43f5e}
.ctrl.fav-on svg{fill:currentColor}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(var(--player-h) + 22px);transform:translate(-50%,12px);
  background:var(--text);color:var(--bg);font-size:13px;padding:10px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:150;
  max-width:min(90vw,520px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.foot-note{padding:6px 26px 20px;font-size:11.5px;color:var(--text-3);text-align:center;max-width:960px;margin:0 auto}

/* ===================== 小屏形态（< 900px） ===================== */
@media (max-width:900px){
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;width:272px;
    transform:translateX(-105%);box-shadow:var(--shadow-lift);
  }
  .sidebar.open{transform:none}
  .side-overlay.show{display:block}
  .menu-btn{display:grid}
  .topbar{padding:10px 14px;gap:9px}
  .search-meta{display:none}
  /* 小屏：第一行搜索，第二行音源开关（横向滚动）+ 条数，避免堆叠成三行 */
  .search-wrap{order:1;flex:1 1 auto;max-width:none}
  .menu-btn{order:0}
  .source-chips{
    order:2;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px;
  }
  .source-chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0}
  .limit-select{order:3;flex-shrink:0}
  main{padding:4px 14px 30px}
  .track-row{grid-template-columns:30px 44px minmax(0,1fr) 38px;gap:10px;padding:9px 10px}
  .t-album{display:none}
  .t-tags{display:none}
  /* 小屏列表保留「加入歌单」按钮（其余行内操作收起） */
  .t-actions{display:flex;gap:0}
  .t-act{width:34px;height:34px}
  .t-act[data-act="fav"],.t-act[data-act="download"],.t-act[data-act="remove"]{display:none}
  .card-row{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:13px}
  .np-stage{flex-direction:column;align-items:center;gap:8px;padding-top:0}
  .np-left{
    width:100%;max-width:320px;gap:6px;
    justify-content:flex-start; /* 覆盖桌面的 center，否则顶部会留出一段空白 */
  }
  /* 封面只露出下半圆：容器固定为半圆高度，img 放大 2 倍并上移一个半高，
     旋转中心恰好是圆心（容器顶边中点），不需要 clip-path + 负 margin 的脆弱组合 */
  .np-cover-big{
    width:min(72vw,300px);
    height:calc(min(72vw,300px) / 2);
    aspect-ratio:auto;
    border-radius:0 0 calc(min(72vw,300px) / 2) calc(min(72vw,300px) / 2);
    font-size:56px;
  }
  .np-cover-big img{position:absolute;left:0;top:-100%;width:100%;height:200%;object-fit:cover}
  .np-cover-big::after{display:none}
  .np-name-big{font-size:19px}
  .lyrics-line{font-size:14px}
  .lyrics-line.active{font-size:16px}
  /* 小屏播放页：顶部区（返回按钮 + 半圆封面 + 歌名歌手）整体吸顶 */
  .np-left{
    position:sticky;top:0;z-index:30;flex-shrink:0;
    padding-bottom:8px;
    /* 背景压住下方滚上来的歌词，避免重叠 */
    background:linear-gradient(var(--bg) 84%, color-mix(in oklab, var(--bg) 0%, transparent));
  }
  .np-back{
    display:inline-flex;align-self:flex-start;
    height:36px;padding:0 14px 0 10px;border-radius:999px;
    background:color-mix(in oklab, var(--surface) 90%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:600;
    box-shadow:var(--shadow);margin-bottom:4px;
  }
  .np-back .icon{width:18px;height:18px}
  /* 歌词区独立滚动，不与顶部区重叠 */
  .np-right{flex:1;min-height:0;overflow:hidden}
  .lyrics-body{padding:10px 8px 40px}

  /* 播放页沉浸：隐藏搜索栏 */
  body.np-mode .topbar{display:none}
  body.np-mode main{padding:10px 16px calc(var(--player-h) + 16px)}

  /* 迷你播放条：封面+信息 / 上一首·播放·下一首 / 收藏 */
  .player-inner{grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:0 12px}
  .p-center{flex-direction:row;gap:14px}
  .progress-row{display:none}
  .p-right{display:flex;gap:2px}
  /* 小屏播放条只保留收藏，下载 / 歌词 / 音量收起 */
  .p-right #downloadBtn,.p-right #lyricsBtn,.p-right .volume-wrap{display:none}
  /* 小屏隐藏随机/循环以腾出空间，三种播放模式仍可在桌面端切换 */
  .ctrl-shuffle,.ctrl-mode{display:none}
  .np .np-tags{display:none}
  /* 安全区适配（iPhone 底部横条） */
  .player{height:calc(var(--player-h) + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px)}
  .toast{bottom:calc(var(--player-h) + env(safe-area-inset-bottom, 0px) + 16px)}
}
@media (max-width:520px){
  .np-name{font-size:12.5px}
  .brand .name{font-size:13.5px}
  .section-head h2{font-size:17px}
  .track-row{grid-template-columns:26px 40px minmax(0,1fr) 36px;gap:9px;padding:8px 10px}
  .t-cover{width:40px;height:40px}
}
</style>

  // 沿用旧版 key，保证老用户数据可继续读取
  const LIBRARY_STORAGE_KEY = 'pikachu-music-library-v1';
  const HISTORY_STORAGE_KEY = 'musicsquare-history-v1';
  const THEME_STORAGE_KEY = 'musicsquare-theme';

  const HISTORY_MAX = 60;

  const dom = {};
  function $(id){ return document.getElementById(id); }
  function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function t(k){ return (I18N[state.language] && I18N[state.language][k]) || I18N.zh[k] || k; }

  let toastTimer = null;
  function showToast(msg){
    const el = dom.toast; if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
  }
  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function relTime(ts){
    const diff = Date.now() - ts;
    if(diff < 60e3) return state.language === 'zh' ? '刚刚' : 'just now';
    if(diff < 3600e3) return Math.floor(diff / 60e3) + (state.language === 'zh' ? ' 分钟前' : 'm ago');
    if(diff < 86400e3) return Math.floor(diff / 3600e3) + (state.language === 'zh' ? ' 小时前' : 'h ago');
    const d = new Date(ts);
    return (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  const SOURCE_LABEL = {netease:'sourceNetease', qq:'sourceQQ', kuwo:'sourceKuwo', joox:'sourceJoox'};

  /* ===================== 本地存储 ===================== */
  function serializeTrack(track){
    if(!track) return null;
    const keys = ['uid','source','displayIndex','keyword','songid','songMid','qqId','qqSearchKey','qqIndex',
      'jooxIndex','jooxSongId','jooxSongMid','title','artist','album','cover','pageUrl',
      'quality','qualityLabel','qqQualityText','jooxQualityText','pay','isPreview'];
    const out = {};
    keys.forEach(function(k){
      if(track[k] !== undefined && track[k] !== null && track[k] !== '') out[k] = track[k];
    });
    out.detailsLoaded = false;
    out.audioUrl = null;
    out.lrc = null;
    out.lrcUrl = null;
    return out.uid ? out : null;
  }
  function deserializeTrack(raw){
    if(!raw || raw.source === 'migu') return null;
    const track = serializeTrack(raw);
    if(!track) return null;
    track.detailsLoaded = false;
    return track;
  }

  function saveLibrary(){
    try{
      localStorage.setItem(LIBRARY_STORAGE_KEY, JSON.stringify({
        version:2,
        savedAt:new Date().toISOString(),
        favorites:state.favorites.map(serializeTrack).filter(Boolean),
        playlists:state.playlists.map(function(pl){
          return {id:pl.id, name:pl.name, tracks:(pl.tracks||[]).map(serializeTrack).filter(Boolean)};
        })
      }));
    }catch(e){ console.warn('save library failed', e); }
  }
  function saveHistory(){
    try{
      localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify({
        version:1,
        savedAt:new Date().toISOString(),
        history:state.history.slice(0, HISTORY_MAX).map(function(h){
          const tr = serializeTrack(h.track);
          if(!tr) return null;
          return {uid:h.uid, playedAt:h.playedAt, position:h.position || 0, duration:h.duration || 0, track:tr};
        }).filter(Boolean)
      }));
    }catch(e){ console.warn('save history failed', e); }
  }
  function loadLibrary(){
    try{
      const raw = localStorage.getItem(LIBRARY_STORAGE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      state.favorites = Array.isArray(data.favorites) ? data.favorites.map(deserializeTrack).filter(Boolean) : [];
      state.playlists = Array.isArray(data.playlists) ? data.playlists.map(function(pl, idx){
        return {
          id: pl.id || ('pl-' + idx + '-' + Date.now()),
          name: pl.name || (state.language === 'zh' ? '未命名歌单' : 'Untitled'),
          tracks: Array.isArray(pl.tracks) ? pl.tracks.map(deserializeTrack).filter(Boolean) : []
        };
      }) : [];
      state.playlists.forEach(function(pl){ pl.tracks.forEach(regTrack); });
      state.favorites.forEach(regTrack);
    }catch(e){ console.warn('load library failed', e); }
  }
  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      const arr = Array.isArray(data) ? data : data.history;
      if(!Array.isArray(arr)) return;
      state.history = arr.map(function(h){
        const tr = deserializeTrack(h.track || h);
        if(!tr) return null;
        return {
          uid: tr.uid,
          track: tr,
          playedAt: h.playedAt || Date.now(),
          position: h.position || 0,
          duration: h.duration || 0
        };
      }).filter(Boolean);
      state.history.forEach(function(h){ regTrack(h.track); });
    }catch(e){ console.warn('load history failed', e); }
  }
  function regTrack(track){
    if(track && track.uid && !state.trackMap.has(track.uid)) state.trackMap.set(track.uid, track);
  }

  function pushHistory(track, position, duration){
    if(!track || !track.uid) return;
    const idx = state.history.findIndex(function(h){ return h.uid === track.uid; });
    const entry = {
      uid: track.uid,
      track: track,
      playedAt: Date.now(),
      position: position || 0,
      duration: duration || 0
    };
    if(idx >= 0) state.history.splice(idx, 1);
    state.history.unshift(entry);
    if(state.history.length > HISTORY_MAX) state.history.length = HISTORY_MAX;
    saveHistory();
    regTrack(track);
  }

  /* 搜索结果分流：普通搜索进 state.searchResults，推荐流进临时 sink */
  let searchSink = null;
  function pushList(){ return searchSink ? searchSink.list : state.searchResults; }
  function seenSet(){ return searchSink ? searchSink.seen : state.trackMap; }

  /* ===================== 搜索：四大音源 ===================== */
  const REQ_TIMEOUT = 10000;
  function fetchWithTimeout(url, timeoutMs, options){
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs || REQ_TIMEOUT);
    return fetch(url, Object.assign({signal:ctrl.signal}, options || {}))
      .then(function(res){ clearTimeout(timer); return res; })
      .catch(function(err){ clearTimeout(timer); throw err; });
  }
  function fetchJSON(url, timeoutMs){
    return fetchWithTimeout(url, timeoutMs).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }
  function toHttps(url){
    return String(url || '').replace(/^http:\/\//i, 'https://');
  }

  function pickQueryParam(rawUrl, key){
    if(!rawUrl) return '';
    try{
      return new URL(rawUrl, window.location.href).searchParams.get(key) || '';
    }catch(e){
      const m = String(rawUrl).match(new RegExp('[?&]' + key + '=([^&]+)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
  }

  async function searchNetease(kw, page, num){
    const requestLimit = Math.max(1, page || 1) * Math.max(1, num || 10);
    const url = 'https://api.qijieya.cn/meting/?type=search&id=' + encodeURIComponent(kw) +
      '&limit=' + encodeURIComponent(requestLimit) + '&server=netease';
    let added = 0;
    try{
      const json = await fetchJSON(url, REQ_TIMEOUT);
      if(!Array.isArray(json)) return 0;
      json.forEach(function(it, idx){
        const songId = pickQueryParam(it.url, 'id') || (kw + '-' + (idx + 1));
        const uid = 'netease-' + songId;
        if(seenSet().has(uid)) return;
        const track = {
          uid:uid, source:'netease', displayIndex:idx + 1, keyword:kw,
          songid:songId, title:it.name || '', artist:it.artist || '', album:'',
          cover:it.pic || null, audioUrl:it.url || null, lrc:null, lrcUrl:it.lrc || null,
          detailsLoaded:false, quality:null, qualityLabel:null
        };
        state.trackMap.set(uid, track);
        pushList().push(track);
        added++;
      });
    }catch(e){ console.warn('netease search failed', e); }
    return added;
  }

  async function searchQQ(kw, limit){
    const added = await searchQQMeting(kw, limit);
    if(added > 0) return added;
    return searchQQTang(kw, limit);
  }

  function makeQQTrack(mid, idx, kw, extra){
    const uid = 'qq-' + mid;
    if(seenSet().has(uid)) return null;
    const track = {
      uid:uid, source:'qq', displayIndex:idx + 1, keyword:kw, qqSearchKey:kw,
      qqIndex:idx + 1, qqId:mid, songid:mid, songMid:mid,
      title:'', artist:'', album:'',
      cover:null, audioUrl:null, lrc:null, lrcUrl:null,
      detailsLoaded:false, quality:null, qualityLabel:null, pay:null
    };
    Object.assign(track, extra || {});
    state.trackMap.set(uid, track);
    pushList().push(track);
    return track;
  }

  async function searchQQMeting(kw, limit){
    const url = 'https://api.qijieya.cn/meting/?type=search&id=' + encodeURIComponent(kw) +
      '&limit=' + encodeURIComponent(limit || 10) + '&server=tencent';
    let added = 0;
    try{
      const json = await fetchJSON(url, 8000);
      if(!Array.isArray(json)) return 0;
      json.slice(0, limit || json.length).forEach(function(it, idx){
        const mid = pickQueryParam(it.url, 'id');
        if(!mid) return;
        const track = makeQQTrack(mid, idx, kw, {
          title:it.name || '',
          artist:it.artist || '',
          cover:it.pic || null,
          lrcUrl:it.lrc || null
        });
        if(track) added++;
      });
    }catch(e){ console.warn('qq search (meting) failed', e); }
    return added;
  }

  async function searchQQTang(kw, limit){
    const url = 'https://tang.api.s01s.cn/music_open_api.php?msg=' + encodeURIComponent(kw) + '&type=json';
    let added = 0;
    try{
      const json = await fetchJSON(url, 8000);
      const data = Array.isArray(json) ? json : (Array.isArray(json && json.data) ? json.data : []);
      if(!Array.isArray(data) || !data.length) return 0;
      data.slice(0, limit || data.length).forEach(function(it, idx){
        const mid = it.song_mid;
        if(!mid) return;
        const track = makeQQTrack(mid, idx, kw, {
          title:it.song_title || '',
          artist:it.singer_name || '',
          qqQualityText:it.pay || null,

        });
        if(track) added++;
      });

    return added;
  }
