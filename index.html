  function getInterleavedSearchList(){
    const grouped = {netease:[], qq:[], kuwo:[], joox:[]};
    state.searchResults.forEach(function(x){ if(grouped[x.source]) grouped[x.source].push(x); });
    Object.keys(grouped).forEach(function(k){
      grouped[k].sort(function(a,b){ return (a.displayIndex||0) - (b.displayIndex||0); });
    });
    const order = ['netease','qq','kuwo','joox'];
    const idx = {netease:0, qq:0, kuwo:0, joox:0};
    const out = [];
    let added = true;
    while(added){
      added = false;
      for(const s of order){
        const arr = grouped[s], i = idx[s];
        if(arr && i < arr.length){ out.push(arr[i]); idx[s]++; added = true; }
      }
    }
    return out;
  }

  async function searchAllSources(reset){
    if(!state.searchKeyword){ showToast(t('toastNeedKeyword')); return; }
    const enabled = Object.keys(state.enabledSources).filter(function(k){ return state.enabledSources[k]; });
    if(!enabled.length){ showToast(t('searchStatusNoSource')); return; }
    state.searchInProgress = true;
    dom.searchStatus.textContent = t('searchStatusSearching');

    if(reset){
      Object.keys(state.perSourceCurrentLimit).forEach(function(k){ state.perSourceCurrentLimit[k] = state.perSourceLimit; });
      Object.keys(state.perSourcePage).forEach(function(k){ state.perSourcePage[k] = 1; });
      state.searchResults = [];
      state.noMoreResults = false;
    }

    const kw = state.searchKeyword;
    const tasks = [];
    for(const s of enabled){
      const limit = state.perSourceCurrentLimit[s] || state.perSourceLimit;
      if(s === 'netease') tasks.push(searchNetease(kw, state.perSourcePage.netease || 1, state.perSourceLimit));
      if(s === 'qq') tasks.push(searchQQ(kw, limit));
      if(s === 'kuwo') tasks.push(searchKuwo(kw, limit));
      if(s === 'joox') tasks.push(searchJoox(kw, limit));
    }
    let added = 0;
    try{
      const res = await Promise.all(tasks);
      added = res.reduce(function(a,b){ return a + (b || 0); }, 0);
    }catch(e){
      console.error(e);
      showToast(t('toastSearchError'));
    }

    state.searchInProgress = false;
    dom.searchStatus.textContent = t('searchStatusDone');
    dom.searchCount.textContent = String(state.searchResults.length);
    if(!reset){
      if(added === 0){ state.noMoreResults = true; showToast(t('toastNoMore')); }
      else state.noMoreResults = false;
    }
    renderResults();
  }

  function requestMoreResults(){
    const enabled = Object.keys(state.enabledSources).filter(function(k){ return state.enabledSources[k]; });
    if(!enabled.length) return;
    if(state.searchInProgress || state.noMoreResults) return;
    enabled.forEach(function(src){
      if(src === 'netease') state.perSourcePage.netease = (state.perSourcePage.netease || 1) + 1;
      else state.perSourceCurrentLimit[src] = (state.perSourceCurrentLimit[src] || state.perSourceLimit) + state.perSourceLimit;
    });
    searchAllSources(false);
  }

  /* ===================== 音乐推荐 ===================== */
  const RECOMMEND_POOL = [
    '抖音热歌', '古风', '说唱', '轻音乐', '民谣', '粤语经典',
    '周杰伦', '林俊杰', '陈奕迅', '邓紫棋', '五月天', '薛之谦',
    '毛不易', '告五人', '电影原声', '钢琴曲'
  ];
  const REC_PER_KEYWORD = 6;   // 每个关键词每源取的条数
  const REC_KEYWORDS = 3;      // 每批使用的关键词数
  const REC_MAX = 30;          // 推荐列表上限

  function pickRecommendKeywords(){
    const out = [];
    const pool = RECOMMEND_POOL.slice();
    for(let i = 0; i < REC_KEYWORDS && pool.length; i++){
      const idx = (state.recommendSeed * 7 + i * 5) % pool.length;
      out.push(pool.splice(idx, 1)[0]);
    }
    return out;
  }

  function dedupeTracks(list, max){
    const seen = new Set();
    const out = [];
    list.forEach(function(tr){
      if(!tr || !tr.uid) return;
      const key = (tr.title || '').trim().toLowerCase() + '|' + (tr.artist || '').trim().toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      out.push(tr);
    });
    return out.slice(0, max || REC_MAX);
  }

  async function loadRecommendations(advance){
    if(state.recommendLoading) return;
    if(advance) state.recommendSeed = (state.recommendSeed + 1) % 97;
    state.recommendLoading = true;
    renderRecommend();

    const keywords = pickRecommendKeywords();
    const sink = {list:[], seen:new Set()};
    searchSink = sink;
    try{
      const tasks = [];
      keywords.forEach(function(kw){
        tasks.push(searchNetease(kw, 1, REC_PER_KEYWORD));
        tasks.push(searchQQ(kw, REC_PER_KEYWORD));
        tasks.push(searchKuwo(kw, REC_PER_KEYWORD));
      });
      await Promise.all(tasks);
    }catch(e){ console.error('recommend', e); }
    finally{ searchSink = null; }

    state.recommendList = dedupeTracks(sink.list, REC_MAX);
    state.recommendKeywords = keywords;
    state.recommendLoading = false;
    renderRecommend();
  }

  function renderRecommend(){
    const wrap = dom.recommendList;
    if(!wrap) return;
    if(dom.recHint){
      dom.recHint.textContent = state.recommendKeywords && state.recommendKeywords.length
        ? state.recommendKeywords.join(' · ') : '';
    }
    if(state.recommendLoading){
      wrap.innerHTML = '<div class="rec-loading"><span class="rec-spin"></span>' + esc(t('recommendLoading')) + '</div>';
      return;
    }
    if(!state.recommendList.length){
      wrap.innerHTML = emptyBlock(t('emptyRecommend'));
      return;
    }
    wrap.innerHTML = state.recommendList.map(function(track, i){ return rowHTML(track, i, 'recommend'); }).join('');
    bindRows(wrap, 'recommend');
  }

  /* ===================== 详情 ===================== */
  function inferQualityFromUrl(url){
    if(!url) return {tag:null, label:''};
    const base = url.split('?')[0].toLowerCase();
    const m = base.match(/\.([a-z0-9]+)$/);
    const ext = m ? m[1] : '';
    if(['flac','wav','ape','alac','aiff'].indexOf(ext) >= 0) return {tag:'lossless', label:'LOSSLESS'};
    return {tag:'320k', label:'320K'};
  }

  async function fetchNeteaseDetails(track){
    if(track.songid){
      if(!track.audioUrl) track.audioUrl = 'https://api.qijieya.cn/meting/?server=netease&type=url&id=' + encodeURIComponent(track.songid);
      if(!track.lrcUrl) track.lrcUrl = 'https://api.qijieya.cn/meting/?server=netease&type=lrc&id=' + encodeURIComponent(track.songid);
    }
    if(track.audioUrl){
      const q = inferQualityFromUrl(track.audioUrl);
      track.quality = q.tag; track.qualityLabel = q.label;
    }
    if(!track.lrc && track.lrcUrl){
      try{
        const lr = await fetchWithTimeout(track.lrcUrl, REQ_TIMEOUT);
        const ct = (lr.headers.get('content-type') || '').toLowerCase();
        if(ct.indexOf('json') >= 0){
          const lj = await lr.json();
          track.lrc = (typeof lj === 'string' ? lj : null) || lj.lrc || lj.lyric ||
            (lj.data && (lj.data.lrc || lj.data.lyric)) || (typeof lj.data === 'string' ? lj.data : null) || track.lrc || null;
        }else{
          track.lrc = await lr.text();
        }
      }catch(e){ console.warn('netease lyric failed', e); }
    }
    track.detailsLoaded = true;
  }

  async function fetchQQDetails(track){
    const mid = (track.qqId || track.songMid || track.songid || '').toString().trim();
    if(!mid) return;
    // vkeys 的 QQ 接口只返回固定 60 秒试听片段（实测每首恒定 960887 字节 ≈ 128kbps×60s），
    // tang 接口才返回完整版。因此以 tang 为主源，tang 拿不到直链时才退回 vkeys 并标记为试听。
    await fetchQQTang(track, mid);
    if(track.audioUrl){ track.isPreview = false; return; }
    if(await fetchQQVkeys(track, mid)) track.isPreview = true;
  }

  function extractQQCore(filename){
    const m = String(filename || '').match(/^[A-Za-z0-9]*?(\d{3,}[A-Za-z0-9]+)\./);
    return m ? m[1] : '';
  }

  function pickQQPlayUrl(d){
    const core = extractQQCore(d.song_filename || d.song_filename_hq || '');
    // sq / pq 是 FLAC 无损，单曲约 50MB，网页端流式播放首帧太慢；
    // 默认取 hq（m4a，约 193kbps，单曲 ~6MB），无损排在其后仅作兜底。
    const order = [
      {key:'hq', tag:'hq', label:'HQ'},
      {key:'standard', tag:'standard', label:'STD'},
      {key:'sq', tag:'lossless', label:'LOSSLESS'},
      {key:'pq', tag:'lossless', label:'LOSSLESS'},
      {key:'fq', tag:'low', label:'LOW'},
      {key:'accom', tag:'hq', label:'HQ'}
    ];
    for(const o of order){
      const u = d['song_play_url_' + o.key];
      const fn = d['song_filename_' + o.key] || '';
      if(!u) continue;
      if(core && fn && fn.indexOf(core) < 0) continue;
      const kb = String(d['kbps_' + o.key] || '').match(/(\d+)/);
      return {url:u, tag:o.tag, label:o.label, kb:kb ? kb[1] : '',
        text:(o.label + ' ' + (kb ? kb[1] : '')).trim()};
    }
    const kb0 = String(d.kbps || '').match(/(\d+)/);
    if(d.song_play_url) return {url:d.song_play_url, tag:null, label:null, kb:kb0 ? kb0[1] : '', text:null};
    return {url:null, tag:null, label:null, kb:'', text:null};
  }

  async function fetchQQVkeys(track, mid){
    try{
      const res = await fetchJSON('https://api.vkeys.cn/v2/music/tencent?mid=' + encodeURIComponent(mid), 8000);
      const d = (res && res.code === 200) ? res.data : null;
      if(!d || !d.url) return false;
      track.title = d.song || track.title;
      track.artist = d.singer || track.artist;
      track.album = d.album || track.album || '';
      track.cover = d.cover || track.cover;
      track.pageUrl = d.link || track.pageUrl;
      track.pay = d.pay || track.pay;
      track.qqQualityText = d.quality || track.qqQualityText || null;
      track.audioUrl = toHttps(d.url);
      const kb = String(d.kbps || '').match(/(\d+)/);
      if(kb){ track.quality = kb[1] + 'k'; track.qualityLabel = kb[1] + 'K'; }
      track.detailsLoaded = true;
      return true;
    }catch(e){ console.warn('qq detail (vkeys) failed', e); return false; }
  }

  async function fetchQQTang(track, mid){
    const msg = (track.qqSearchKey || track.keyword || '').trim() || ((track.title || '') + ' ' + (track.artist || '')).trim();
    const url = 'https://tang.api.s01s.cn/music_open_api.php?msg=' + encodeURIComponent(msg) +
      '&type=json&mid=' + encodeURIComponent(mid);
    try{
      const d = await fetchJSON(url, 12000);
      if(!d || typeof d !== 'object' || !d.song_mid) throw new Error('qq detail error');
      track.title = d.song_title || d.song_name || track.title;
      track.artist = d.singer_name || track.artist;
      track.album = d.album_name || d.album_title || track.album || '';
      track.cover = d.album_pic || d.singer_pic || track.cover;
      track.pageUrl = d.song_h5_url || track.pageUrl;
      track.lrc = d.song_lyric || d.lyric || track.lrc;
      const best = pickQQPlayUrl(d);
      track.audioUrl = best.url ? toHttps(best.url) : track.audioUrl;
      track.qqQualityText = best.text || (d.vip ? ('VIP:' + d.vip) : null) || track.qqQualityText;
      if(best.tag && best.label){ track.quality = best.tag; track.qualityLabel = best.label; }
      // 优先用接口给出的真实码率；否则按扩展名推断（m4a 会被统一标成 320K，不够准）
      if(best.kb){ track.quality = best.kb + 'k'; track.qualityLabel = best.kb + 'K'; }
      else if(track.audioUrl){
        const q = inferQualityFromUrl(track.audioUrl);
        if(q && q.label){ track.quality = q.tag; track.qualityLabel = q.label; }
      }
      track.detailsLoaded = true;
    }catch(e){ console.warn('qq detail (tang) failed', e); }
  }

  async function fetchKuwoDetails(track){
    const n = track.displayIndex || 1;
    const base = 'https://oiapi.net/api/Kuwo?msg=' + encodeURIComponent(track.keyword) + '&n=' + encodeURIComponent(n);
    const tasks = [base + '&br=1', base + '&br=320kmp3'].map(function(u){
      return fetchJSON(u, REQ_TIMEOUT).catch(function(){ return null; });
    });
    const datas = (await Promise.all(tasks))
      .map(function(j){ return (j && j.data && !Array.isArray(j.data)) ? j.data : null; })
      .filter(Boolean);
    if(!datas.length) throw new Error('kuwo detail failed');

    const d = datas[0];
    Object.assign(track, {
      title:d.song || track.title,
      artist:d.singer || track.artist,
      album:d.album || track.album,
      cover:d.picture || track.cover,
      songid:(d.rid == null ? track.songid : d.rid),
      lrcUrl:null,
      detailsLoaded:true
    });

    const cands = [];
    datas.forEach(function(x){
      if(!x.url) return;
      const url = toHttps(x.url);
      if(cands.some(function(c){ return c.url === url; })) return;
      cands.push({url:url, bitrate:x.bitrate, format:x.format});
    });
    track.audioCandidates = cands;
    track.audioUrl = cands.length ? cands[0].url : track.audioUrl;
    applyKuwoQuality(track, cands[0]);

    fetchKuwoLrc(track, d);
  }

  function applyKuwoQuality(track, cand){
    if(!cand) return;
    const fmt = String(cand.format || '').toLowerCase();
    const bit = parseInt(cand.bitrate, 10) || 0;
    if(fmt === 'flac' || fmt === 'wav' || fmt === 'ape' || bit >= 900){
      track.quality = 'lossless'; track.qualityLabel = 'LOSSLESS';
    }else if(bit){
      track.quality = bit + 'k'; track.qualityLabel = bit + 'K';
    }
  }

  async function fetchKuwoLrc(track, d){
    const rid = String((d && d.rid) || track.songid || '');
    const musicId = rid.replace(/^MUSIC_/i, '');
    if(!/^\d+$/.test(musicId)) return;
    // 启动时会并发跑推荐流，弱网下容易超时，这里放宽超时并重试一次
    const api = 'https://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=' + musicId;
    const wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
    let list = [];
    // 该接口偶发超时或返回空列表（部分歌曲本身无歌词，status=301），失败与空结果都重试一次
    for(let attempt = 0; attempt < 2 && !list.length; attempt++){
      if(attempt) await wait(600);
      try{
        const j = await fetchJSON(api, 10000);
        list = (j && j.data && Array.isArray(j.data.lrclist)) ? j.data.lrclist : [];
      }catch(e){ /* 进入下一次重试 */ }
    }
    if(!list.length) return;
    track.lrc = list.map(function(x){
      const sec = parseFloat(x.time) || 0;
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(2);
      return '[' + String(m).padStart(2, '0') + ':' + String(s).padStart(5, '0') + ']' + (x.lineLyric || '');
    }).join('\n');
    if(state.currentTrack && state.currentTrack.uid === track.uid){
      state.lyricLines = parseLRC(track.lrc);
      renderLyrics();
    }
  }

  async function fetchJooxDetails(track){
    const n = track.jooxIndex || track.displayIndex || 1;
    const url = 'https://apicx.asia/api/joox_music?msg=' + encodeURIComponent(track.keyword) +
      '&n=' + encodeURIComponent(n) + '&token=' + encodeURIComponent(JOOX_TOKEN) + '&br=' + encodeURIComponent(JOOX_BR);
    const j = await fetchJSON(url, REQ_TIMEOUT);
    if(!j || j.code !== 200 || !j.data) throw new Error('joox detail failed');
    const d = j.data;
    const playLinks = d['播放链接'] || {};
    async function probe(u){
      if(!u) return false;
      async function req(method, extra){
        const ctrl = new AbortController();
        const timer = setTimeout(function(){ ctrl.abort(); }, 3000);
        try{
          const r = await fetch(u, Object.assign({method:method, cache:'no-store', redirect:'follow', signal:ctrl.signal}, extra || {}));
          return !!r && (r.ok || r.status === 206 || (r.status >= 200 && r.status < 400));
        }finally{ clearTimeout(timer); }
      }
      try{ if(await req('HEAD')) return true; }catch(e){}
      try{ return await req('GET', {headers:{Range:'bytes=0-0'}}); }catch(e){ return false; }
    }
    const order = ['Atmos全景声','无损FLAC','Hi-Res无损','母带无损','OGG 320','MP3 320','AAC 192','OGG 192','MP3 128','AAC 96','AAC 48'];
    let best = {url:null, tag:null, label:null, text:null};
    for(const name of order){
      const u = playLinks[name];
      if(!u) continue;
      if(!(await probe(u))) continue;
      if(/母带|无损|flac|hi-res|atmos/i.test(name) || /\.flac(?:\?|$)/i.test(u)){ best = {url:u, tag:'lossless', label:'LOSSLESS', text:name}; break; }
      const m = name.match(/(\d+)$/);
      if(m){ best = {url:u, tag:m[1] + 'k', label:m[1] + 'K', text:name}; break; }
      best = {url:u, tag:null, label:null, text:name};
      break;
    }
    Object.assign(track, {
      title:d['歌曲名称'] || track.title,
      artist:d['歌手'] || track.artist,
      album:d['专辑'] || track.album,
      songid:d['歌曲ID'] || track.songid,
      songMid:d.songmid || track.songMid,
      audioUrl:best.url ? toHttps(best.url) : track.audioUrl,
      lrc:d['歌词内容'] || track.lrc || null,
      lrcUrl:null,
      jooxQualityText:best.text || track.jooxQualityText || null,
      detailsLoaded:true
    });
    if(best.tag && best.label){ track.quality = best.tag; track.qualityLabel = best.label; }
    else if(track.audioUrl){
      const q = inferQualityFromUrl(track.audioUrl);
      track.quality = q.tag; track.qualityLabel = q.label;
    }
  }

  async function ensureTrackDetails(track){
    if(track.detailsLoaded && track.audioUrl && (track.lrc || !track.lrcUrl)) return;
    setPlayerStatus(t('playerStatusLoading'));
    if(track.source === 'netease') await fetchNeteaseDetails(track);
    else if(track.source === 'kuwo') await fetchKuwoDetails(track);
    else if(track.source === 'joox') await fetchJooxDetails(track);
    else await fetchQQDetails(track);
  }

  /* ===================== 歌词 ===================== */
  function parseLRC(txt){
    if(!txt) return [];
    const lines = String(txt).split(/\r?\n/);
    const reg = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/;
    const out = [];
    lines.forEach(function(line){
      const m = reg.exec(line);
      if(!m) return;
      const min = parseInt(m[1], 10) || 0;
      const sec = parseInt(m[2], 10) || 0;
      const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
      const time = min * 60 + sec + ms / 1000;
      const text = line.replace(reg, '').trim();
      if(text) out.push({time:time, text:text});
    });
    out.sort(function(a,b){ return a.time - b.time; });
    return out;
  }
  function renderLyrics(){
    const wrap = dom.lyricsBody;
    if(!wrap) return;
    wrap.innerHTML = '';
    state.currentLyricIndex = -1;
    const head = document.createElement('div');
    head.className = 'lyrics-title';
    head.textContent = state.currentTrack
      ? ((state.currentTrack.title || '') + (state.currentTrack.artist ? ' - ' + state.currentTrack.artist : ''))
      : '';
    if(head.textContent) wrap.appendChild(head);
    if(!state.lyricLines.length){
      const empty = document.createElement('div');
      empty.className = 'lyrics-empty';
      empty.textContent = t('lyricsEmpty');
      wrap.appendChild(empty);
      return;
    }
    state.lyricLines.forEach(function(ln, i){
      const div = document.createElement('div');
      div.className = 'lyrics-line';
      div.dataset.index = String(i);
      div.textContent = ln.text;
      wrap.appendChild(div);
    });
  }
  function updateLyricsHighlight(time){
    const lines = state.lyricLines;
    if(!lines.length) return;
    let idx = state.currentLyricIndex;
    if(idx < 0 || idx >= lines.length || time < lines[idx].time || (idx + 1 < lines.length && time >= lines[idx + 1].time)){
      idx = lines.findIndex(function(l, i){
        const nxt = lines[i + 1];
        if(!nxt) return time >= l.time - 0.05;
        return time >= l.time - 0.05 && time < nxt.time - 0.05;
      });
    }
    if(idx < 0 || idx === state.currentLyricIndex) return;
    state.currentLyricIndex = idx;
    const wrap = dom.lyricsBody;
    if(!wrap) return;
    $$('.lyrics-line.active', wrap).forEach(function(el){ el.classList.remove('active'); });
    const act = wrap.querySelector('.lyrics-line[data-index="' + idx + '"]');
    if(act){
      act.classList.add('active');
      if(state.view === 'nowplaying') wrap.scrollTo({top:act.offsetTop - wrap.clientHeight * 0.45, behavior:'smooth'});
    }
  }

  /* ===================== 收藏 / 歌单 / 记录 ===================== */
  function isFavorite(track){
    if(!track) return false;
    return state.favorites.some(function(x){ return x.uid === track.uid; });
  }
  function toggleFavorite(track){
    if(!track) return;
    const i = state.favorites.findIndex(function(x){ return x.uid === track.uid; });
    if(i >= 0){ state.favorites.splice(i, 1); showToast(t('toastRemovedFav')); }
    else { state.favorites.push(track); showToast(t('toastAddedFav')); }
    saveLibrary();
    renderAll();
  }
  function addTrackToPlaylist(track){
    if(!track) return;
    let plId = dom.plSelect ? dom.plSelect.value : '';
    let pl = state.playlists.find(function(p){ return p.id === plId; });
    if(!pl) pl = state.playlists[0];
    if(!pl){ showToast(t('toastNoPl')); return; }
    if(pl.tracks.some(function(tk){ return tk.uid === track.uid; })){ showToast(t('toastAlreadyInList')); return; }
    pl.tracks.push(track);
    saveLibrary();
    renderAll();
    showToast(t('toastAddedToPl') + ' · ' + pl.name);
  }
  function removeTrackFromPlaylist(trackUid){
    const plId = dom.plSelect ? dom.plSelect.value : '';
    const pl = state.playlists.find(function(p){ return p.id === plId; });
    if(!pl) return;
    const idx = pl.tracks.findIndex(function(tk){ return tk.uid === trackUid; });
    if(idx < 0) return;
    if(!window.confirm(t('confirmRemove'))) return;
    pl.tracks.splice(idx, 1);
    saveLibrary();
    renderAll();
    showToast(t('toastTrackRemoved'));
  }
  function clearHistory(){
    if(!state.history.length) return;
    if(!window.confirm(t('confirmClearHistory'))) return;
    state.history = [];
    saveHistory();
    renderAll();
    showToast(t('toastHistoryCleared'));
  }
  function clearFavorites(){
    if(!state.favorites.length) return;
    if(!window.confirm(t('confirmClearFav'))) return;
    state.favorites = [];
    saveLibrary();
    renderAll();
    showToast(t('toastFavCleared'));
  }

  /* ===================== 播放 ===================== */
  function getActiveList(){
    const tp = state.playContext.type;
    if(tp === 'results'){
      let list = getInterleavedSearchList();
      if(!list.length && state.searchResults.length) list = state.searchResults.slice();
      return list;
    }
    if(tp === 'recommend') return state.recommendList;
    if(tp === 'favorites') return state.favorites;
    if(tp === 'history') return state.history.map(function(h){ return h.track; });
    if(tp === 'playlist'){
      const pl = state.playlists.find(function(p){ return p.id === state.playContext.playlistId; });
      return pl ? pl.tracks : [];
    }
    return getInterleavedSearchList();
  }

  function setPlayerStatus(text){
    if(dom.npTags) {
      const el = dom.npTags.querySelector('.np-status');
      if(el) el.textContent = text || '';
    }
  }

  function buildAudioCandidates(track){
    const list = (track && track.audioCandidates) ? track.audioCandidates : [];
    const urls = list.map(function(c){ return (typeof c === 'string') ? c : c.url; }).filter(Boolean);
    if(!urls.length && track && track.audioUrl) urls.push(track.audioUrl);

    const out = [];
    urls.forEach(function(url, i){ out.push({url:url, cand:list[i] || null}); });
    urls.forEach(function(url, i){
      if(url.indexOf('https://') === 0){
        out.push({url:url.replace(/^https:\/\//i, 'http://'), cand:list[i] || null});
      }
    });
    return out;
  }

  async function playTrack(track, context, startAt){
    if(!track) return;
    state.currentTrack = track;
    state.playContext = context || state.playContext;
    state.pendingSeek = startAt || 0;
    state.audioStream = [];
    state.audioStreamIndex = 0;

    renderNowPlaying();
    renderResults();
    renderHistoryViews();
    renderFavorites();
    renderPlaylistViews();

    state.lyricLines = track.lrc ? parseLRC(track.lrc) : [];
    renderLyrics();

    try{
      await ensureTrackDetails(track);
      renderNowPlaying();
      state.lyricLines = track.lrc ? parseLRC(track.lrc) : [];
      renderLyrics();
      if(!track.audioUrl){
        showToast(track.source === 'qq' ? t('toastQQUnavailable') : t('toastPlayError'));
        setPlayerStatus(t('playerStatusIdle'));
        return;
      }
      state.audioStream = buildAudioCandidates(track);
      state.audioStreamIndex = 0;
      dom.audio.src = state.audioStream.length ? state.audioStream[0].url : track.audioUrl;
      dom.audio.onloadedmetadata = function(){
        if(state.pendingSeek > 0 && state.pendingSeek < (dom.audio.duration || 0) - 2){
          dom.audio.currentTime = state.pendingSeek;
          showToast(t('toastResumed'));
        }
        state.pendingSeek = 0;
      };
      await dom.audio.play();
      state.isPlaying = true;
      setPlayIcon(true);
      setPlayerStatus(t('playerStatusPlaying'));
      pushHistory(track, 0, dom.audio.duration || 0);
      renderHistoryViews();
    }catch(e){
      console.error(e);
      showToast(t('toastPlayError'));
      setPlayerStatus(t('playerStatusIdle'));
    }
  }

  function playFromList(type, index, plId, startAt){
    let list;
    if(type === 'results') list = getInterleavedSearchList();
    else if(type === 'recommend') list = state.recommendList;
    else if(type === 'favorites') list = state.favorites;
    else if(type === 'history') list = state.history.map(function(h){ return h.track; });
    else {
      const pl = state.playlists.find(function(p){ return p.id === plId; });
      list = pl ? pl.tracks : [];
    }
    if(!list.length) return;
    if(index < 0) index = list.length - 1;
    if(index >= list.length) index = 0;
    state.playContext = {type:type, index:index, playlistId:plId || null};
    playTrack(list[index], state.playContext, startAt);
    if(window.innerWidth <= 900) switchView('nowplaying');
  }

  function playNext(direction){
    const list = getActiveList();
    if(!list.length) return;
    let idx = state.playContext.index;
    if(idx == null || idx < 0 || idx >= list.length) idx = 0;

    if(state.playMode === 'single'){
      dom.audio.currentTime = 0;
      dom.audio.play().catch(function(){});
      return;
    }
    if(state.playMode === 'shuffle'){
      if(list.length === 1) idx = 0;
      else {
        let n;
        do { n = Math.floor(Math.random() * list.length); } while(n === idx);
        idx = n;
      }
    }else{
      idx = (idx + (direction === 'prev' ? -1 : 1) + list.length) % list.length;
    }
    playFromList(state.playContext.type, idx, state.playContext.playlistId);
  }
  function togglePlayPause(){
    if(!dom.audio.src) { showToast(t('toastNoCurrent')); return; }
    if(state.isPlaying) dom.audio.pause();
    else dom.audio.play().catch(function(e){ console.error(e); });
  }
  function setPlayIcon(playing){
    if(!dom.iconPlay || !dom.iconPause) return;
    dom.iconPlay.style.display = playing ? 'none' : 'block';
    dom.iconPause.style.display = playing ? 'block' : 'none';
  }

  /* ===================== 渲染 ===================== */
  /* 封面统一生成：网易云的封面走的是 302 代理接口（比 CDN 直链多一跳），
     偶发加载失败，因此失败时换一个带时间戳的 URL 重试一次，仍失败才降级为占位符 */
  function coverImgHTML(track, eager){
    if(!track || !track.cover) return '<span class="ph">🎵</span>';
    return '<img src="' + esc(toHttps(track.cover)) + '" alt=""' +
      (eager ? ' fetchpriority="high"' : ' loading="lazy"') +
      ' decoding="async" referrerpolicy="no-referrer" onerror="coverFallback(this)">';
  }
  window.coverFallback = function(img){
    if(!img) return;
    if(img.dataset.cvRetried){
      const ph = document.createElement('span');
      ph.className = 'ph';
      ph.textContent = '🎵';
      if(img.parentNode) img.parentNode.replaceChild(ph, img);
      return;
    }
    img.dataset.cvRetried = '1';
    const u = img.getAttribute('src') || '';
    if(!u) return;
    img.setAttribute('src', u + (u.indexOf('?') >= 0 ? '&' : '?') + '_cv=' + Date.now());
  };

  function coverHTML(track){
    if(track && track.cover) return coverImgHTML(track, false);
    return '<span class="ph">🎵</span>';
  }
  function sourcePill(track){
    return '<span class="pill"><span class="dot ' + esc(track.source) + '"></span>' + esc(t(SOURCE_LABEL[track.source] || 'sourceKuwo')) + '</span>';
  }
  function qualityPill(track){
    if(track.isPreview) return '<span class="pill quality">' + esc(t('preview')) + '</span>';
    if(!track.qualityLabel) return '';
    return '<span class="pill quality">' + esc(track.qualityLabel) + '</span>';
  }
  function emptyBlock(text){
    return '<div class="empty"><div class="big">🎧</div>' + esc(text) + '</div>';
  }

  function renderResults(){
    const wrap = dom.resultList;
    if(!wrap) return;
    const list = getInterleavedSearchList();
    dom.searchCount.textContent = String(state.searchResults.length);
    dom.resultHint.textContent = state.searchKeyword ? ('“' + state.searchKeyword + '”') : '';
    if(dom.resultSection) dom.resultSection.hidden = !list.length;
    if(dom.hotSection) dom.hotSection.hidden = !!list.length;
    if(!list.length){
      wrap.innerHTML = '';
      return;
    }
    wrap.innerHTML = list.map(function(track, i){ return rowHTML(track, i, 'results'); }).join('');
    bindRows(wrap, 'results');
  }

  function rowHTML(track, i, type){
    const playing = state.currentTrack && state.currentTrack.uid === track.uid;
    const fav = isFavorite(track);
    const left = '<span class="t-index">' + (i + 1) + '</span>';
    const albumCell = (type === 'history')
      ? '<div class="t-album">' + esc(relTime(track._playedAt || 0)) + (track._position ? ' · ' + esc(formatTime(track._position)) : '') + '</div>'
      : '<div class="t-album">' + esc(track.album || '—') + '</div>';
    return '' +
      '<div class="track-row' + (playing ? ' playing' : '') + '" data-uid="' + esc(track.uid) + '" data-index="' + i + '">' +
        left +
        '<div class="t-cover">' + coverHTML(track) + '</div>' +
        '<div class="t-main">' +
          '<div class="t-name">' + esc(track.title || 'Unknown') + '</div>' +
          '<div class="t-artist">' + esc(track.artist || '') + '</div>' +
        '</div>' +
        albumCell +
        '<div class="t-tags">' + sourcePill(track) + qualityPill(track) + '</div>' +
        '<div class="t-actions">' +
          '<button class="t-act' + (fav ? ' fav-on' : '') + '" data-act="fav" title="' + esc(t('shortcutFav')) + '"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9.2C1.2 8.6 3 5.5 6.2 5.1c2-.3 4 .7 5.8 3 1.8-2.3 3.8-3.3 5.8-3 3.2.4 5 3.5 3.7 6.7C19.5 16.3 12 21 12 21z"/></svg></button>' +
          '<button class="t-act" data-act="add" title="' + esc(t('addCurrent')) + '"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>' +
          '<button class="t-act" data-act="download" title="' + (state.language === 'zh' ? '下载' : 'Download') + '"><svg class="icon" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M4 20h16"/></svg></button>' +
          (type === 'playlist' || type === 'history' ? '<button class="t-act" data-act="remove" title="' + esc(t('removeFromPlaylist')) + '"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' : '') +
        '</div>' +
      '</div>';
  }

  function bindRows(wrap, type){
    $$('.track-row', wrap).forEach(function(row){
      const uid = row.dataset.uid;
      const idx = parseInt(row.dataset.index, 10);
      row.addEventListener('click', function(){ playFromList(type, idx, type === 'playlist' ? (dom.plSelect ? dom.plSelect.value : null) : null); });
      $$('[data-act]', row).forEach(function(btn){
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          const track = state.trackMap.get(uid);
          if(!track) return;
          const act = btn.dataset.act;
          if(act === 'fav') toggleFavorite(track);
          else if(act === 'add') addTrackToPlaylist(track);
          else if(act === 'download') downloadTrack(track);
          else if(act === 'remove'){
            if(type === 'playlist') removeTrackFromPlaylist(uid);
            else {
              state.history = state.history.filter(function(h){ return h.uid !== uid; });
              saveHistory(); renderAll();
            }
          }
        });
      });
    });
  }

  async function downloadTrack(track){
    try{
      await ensureTrackDetails(track);
      if(!track.audioUrl){ showToast(t('toastDownloadNotReady')); return; }
      window.open(track.audioUrl, '_blank');
    }catch(e){ showToast(t('toastDownloadNotReady')); }
  }

  function renderHistoryViews(){
    const wrap = dom.hisList;
    if(!wrap) return;
    dom.hisHint.textContent = state.history.length ? (state.history.length + ' ' + t('front')) : '';
    if(!state.history.length){
      wrap.innerHTML = emptyBlock(t('emptyHistory'));
    }else{
      wrap.innerHTML = state.history.map(function(h, i){
        const cloned = Object.assign({}, h.track, {_playedAt:h.playedAt, _position:h.position});
        return rowHTML(cloned, i, 'history');
      }).join('');
      bindRows(wrap, 'history');
    }
    if(dom.navHisCount) dom.navHisCount.textContent = String(state.history.length);
  }

  function renderFavorites(){
    const wrap = dom.favList;
    if(!wrap) return;
    dom.favHint.textContent = state.favorites.length ? (state.favorites.length + ' ' + t('front')) : '';
    if(!state.favorites.length) wrap.innerHTML = emptyBlock(t('emptyFavorites'));
    else {
      wrap.innerHTML = state.favorites.map(function(track, i){ return rowHTML(track, i, 'favorites'); }).join('');
      bindRows(wrap, 'favorites');
    }
    if(dom.navFavCount) dom.navFavCount.textContent = String(state.favorites.length);
    if(dom.favBtn) dom.favBtn.classList.toggle('fav-on', isFavorite(state.currentTrack));
  }

  function renderPlaylistOptions(){
    if(!dom.plSelect) return;
    const prev = dom.plSelect.value || state.playContext.playlistId;
    dom.plSelect.innerHTML = '';
    if(!state.playlists.length){
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = state.language === 'zh' ? '暂无歌单' : 'No playlist';
      dom.plSelect.appendChild(opt);
      state.playContext.playlistId = null;
      return;
    }
    const nextValue = state.playlists.some(function(x){ return x.id === prev; }) ? prev : state.playlists[0].id;
    state.playlists.forEach(function(pl){
      const opt = document.createElement('option');
      opt.value = pl.id;
      opt.textContent = (pl.id === nextValue ? '★ ' : '') + pl.name + ' (' + pl.tracks.length + ')';
      dom.plSelect.appendChild(opt);
    });
    dom.plSelect.value = nextValue;
    state.playContext.playlistId = nextValue;
  }

  function renderSidebarPlaylists(){
    const wrap = dom.sidebarPlList;
    if(!wrap) return;
    if(!state.playlists.length){
      wrap.innerHTML = '<div class="side-empty">' + esc(t('noPlaylistShort')) + '</div>';
      return;
    }
    wrap.innerHTML = '';
    state.playlists.forEach(function(pl){
      const isDefault = state.playContext.playlistId === pl.id;
      const item = document.createElement('button');
      item.className = 'side-pl' + (isDefault ? ' active default' : '');
      item.title = isDefault ? t('defaultPlaylistHint') : '';
      item.innerHTML =
        (isDefault ? '<svg class="star" viewBox="0 0 24 24" aria-label="' + esc(t('defaultPlaylist')) + '"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>' : '') +
        '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>' +
        '<span>' + esc(pl.name) + '</span><span class="pl-count">' + pl.tracks.length + '</span>';
      item.addEventListener('click', function(){
        state.playContext.playlistId = pl.id;
        if(dom.plSelect) dom.plSelect.value = pl.id;
        switchView('playlists');
      });
      wrap.appendChild(item);
    });
  }

  function renderPlaylistViews(){
    renderPlaylistOptions();
    renderSidebarPlaylists();
    const defaultHint = $('plDefaultHint');
    if(defaultHint){
      const cur = state.playlists.find(function(p){ return p.id === state.playContext.playlistId; });
      defaultHint.textContent = cur ? ('★ ' + t('defaultPlaylist') + '：' + cur.name + '（' + t('defaultPlaylistHint') + '）') : '';
    }
    const list = dom.plList;
    if(list){
      const pl = state.playlists.find(function(p){ return p.id === (dom.plSelect ? dom.plSelect.value : ''); }) || state.playlists[0];
      if(!pl) list.innerHTML = emptyBlock(t('emptyPlaylists'));
      else if(!pl.tracks.length) list.innerHTML = emptyBlock(t('emptyPlaylistTracks'));
      else {
        list.innerHTML = pl.tracks.map(function(track, i){ return rowHTML(track, i, 'playlist'); }).join('');
        bindRows(list, 'playlist');
      }
    }
  }

  function renderNowPlaying(){
    const track = state.currentTrack;
    if(!track){
      dom.npName.textContent = t('playerIdleHint');
      dom.npArtist.textContent = '—';
      dom.npTags.innerHTML = '';
      dom.npCover.innerHTML = '<span class="ph">🎧</span>';
      if(dom.npNameBig) dom.npNameBig.textContent = '';
      if(dom.npArtistBig) dom.npArtistBig.textContent = '';
      if(dom.npTagsBig) dom.npTagsBig.innerHTML = '';
      if(dom.npCoverBig){ dom.npCoverBig.innerHTML = '<span class="ph">🎧</span>'; dom.npCoverBig.classList.remove('spinning'); }
      return;
    }
    dom.npName.textContent = track.title || 'Unknown';
    dom.npArtist.textContent = track.artist || '';
    dom.npTags.innerHTML = sourcePill(track) + qualityPill(track) +
      '<span class="np-status">' + esc(state.isPlaying ? t('playerStatusPlaying') : t('playerStatusPaused')) + '</span>';
    dom.npCover.innerHTML = track.cover
      ? coverImgHTML(track, true)
      : '<span class="ph">🎵</span>';

    if(dom.npNameBig) dom.npNameBig.textContent = track.title || 'Unknown';
    if(dom.npArtistBig) dom.npArtistBig.textContent = track.artist || '';
    if(dom.npTagsBig) dom.npTagsBig.innerHTML = sourcePill(track) + qualityPill(track);
    if(dom.npCoverBig){
      dom.npCoverBig.innerHTML = track.cover
        ? coverImgHTML(track, true)
        : '<span class="ph">🎵</span>';
      dom.npCoverBig.classList.toggle('spinning', state.isPlaying);
    }
  }

  function renderAll(){
    renderResults();
    renderRecommend();
    renderHistoryViews();
    renderFavorites();
    renderPlaylistViews();
    renderNowPlaying();
  }

  /* ===================== 视图切换 ===================== */
  function switchView(view){
    state.view = view;
    if(view !== 'nowplaying') state.lastListView = view;
    $$('#nav a').forEach(function(a){ a.classList.toggle('active', a.dataset.view === view); });
    ['discover','favorites','history','playlists','nowplaying'].forEach(function(v){
      const el = $('view-' + v);
      if(el) el.hidden = (v !== view);
    });
    document.body.classList.toggle('np-mode', view === 'nowplaying');
    if(dom.lyricsBtn) dom.lyricsBtn.classList.toggle('on', view === 'nowplaying');
    syncLyricsLabel();
    /* 返回按钮的显隐完全交给 CSS 媒体查询（小屏才显示），这样窗口缩放也能正确响应 */
    state.lyricsOpen = (view === 'nowplaying');
    closeSidebar();
    if(view === 'nowplaying'){
      renderLyrics();
      renderNowPlaying();
      const wrap = dom.lyricsBody;
      if(wrap) wrap.scrollTop = 0;
    }
  }

  function syncLyricsLabel(){
    if(!dom.lyricsBtn) return;
    const lb = dom.lyricsBtn.querySelector('.ctrl-label');
    if(lb) lb.textContent = (state.view === 'nowplaying') ? t('npCollapse') : t('lyricsHint');
  }

  function openSearchPanel(){
    if(!dom.searchPanel) return;
    dom.searchPanel.classList.add('show');
    state.searchPanelOpen = true;
    if(dom.resultSection) dom.resultSection.hidden = !state.searchResults.length;
    renderResults();
  }
  function closeSearchPanel(){
    if(!dom.searchPanel) return;
    dom.searchPanel.classList.remove('show');
    state.searchPanelOpen = false;
  }

  function openSidebar(){
    if(dom.sidebar) dom.sidebar.classList.add('open');
    if(dom.sideOverlay) dom.sideOverlay.classList.add('show');
  }
  function closeSidebar(){
    if(dom.sidebar) dom.sidebar.classList.remove('open');
    if(dom.sideOverlay) dom.sideOverlay.classList.remove('show');
  }

  /* ===================== 导入 / 导出 ===================== */
  function getSnapshot(){
    return {
      version:2,
      savedAt:new Date().toISOString(),
      favorites:state.favorites.map(serializeTrack).filter(Boolean),
      playlists:state.playlists.map(function(pl){
        return {id:pl.id, name:pl.name, tracks:(pl.tracks || []).map(serializeTrack).filter(Boolean)};
      }),
      history:state.history.slice(0, HISTORY_MAX).map(function(h){
        const tr = serializeTrack(h.track);
        return tr ? {uid:h.uid, playedAt:h.playedAt, position:h.position, duration:h.duration, track:tr} : null;
      }).filter(Boolean)
    };
  }
  function exportData(){
    const payload = getSnapshot();
    if(!payload.favorites.length && !payload.playlists.length && !payload.history.length){
      showToast(t('toastPlExportEmpty')); return;
    }
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'musicsquare-data-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast(t('toastPlExported'));
  }
  function mergeTracks(target, rawArr){
    let added = 0;
    if(!Array.isArray(rawArr)) return added;
    rawArr.forEach(function(raw){
      const imported = deserializeTrack(raw);
      if(!imported || !imported.uid) return;
      const track = state.trackMap.get(imported.uid) || imported;
      regTrack(track);
      if(!target.some(function(x){ return x.uid === track.uid; })){ target.push(track); added++; }
    });
    return added;
  }
  function importData(data){
    if(!data || typeof data !== 'object') throw new Error('invalid');
    const addedFav = mergeTracks(state.favorites, data.favorites);
    let addedPl = 0, addedTracks = 0;
    const list = Array.isArray(data.playlists) ? data.playlists : [];
    list.forEach(function(pl, idx){
      if(!pl || typeof pl !== 'object') return;
      const name = (pl.name || (state.language === 'zh' ? '导入歌单' : 'Imported')).toString().trim();
      let target = state.playlists.find(function(x){ return x.id === pl.id; }) || state.playlists.find(function(x){ return x.name === name; });
      if(!target){
        target = {id:pl.id || ('pl-import-' + Date.now() + '-' + idx), name:name, tracks:[]};
        state.playlists.push(target);
        addedPl++;
      }
      addedTracks += mergeTracks(target.tracks, pl.tracks);
    });
    let addedHis = 0;
    if(Array.isArray(data.history)){
      data.history.forEach(function(h){
        const tr = deserializeTrack(h.track || h);
        if(!tr) return;
        regTrack(tr);
        if(!state.history.some(function(x){ return x.uid === tr.uid; })){
          state.history.push({uid:tr.uid, track:tr, playedAt:h.playedAt || Date.now(), position:h.position || 0, duration:h.duration || 0});
          addedHis++;
        }
      });
      state.history.sort(function(a,b){ return b.playedAt - a.playedAt; });
    }
    saveLibrary();
    saveHistory();
    renderAll();
    return {fav:addedFav, pl:addedPl, tracks:addedTracks, his:addedHis};
  }

  /* ===================== 主题 / 语言 ===================== */
  function setTheme(theme, persist){
    if(theme !== 'light' && theme !== 'dark') theme = 'light';
    document.documentElement.dataset.theme = theme;
    if(persist){
      try{ localStorage.setItem(THEME_STORAGE_KEY, theme); }catch(e){}
      showToast(theme === 'dark' ? t('themeDark') : t('themeLight'));
    }
  }
  function setLanguage(lang){
    state.language = (lang === 'en') ? 'en' : 'zh';
    try{ localStorage.setItem(LANG_STORAGE_KEY, state.language); }catch(e){}
    dom.langBtn.textContent = state.language === 'zh' ? 'EN' : '中';
    document.documentElement.lang = state.language === 'zh' ? 'zh-CN' : 'en';
    $$('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    dom.searchInput.placeholder = state.language === 'zh' ? '输入歌名 / 歌手，回车搜索…' : 'Song / artist, press Enter…';
    dom.plNameInput.placeholder = state.language === 'zh' ? '例如：通勤歌单' : 'e.g. Commute mix';
    dom.searchStatus.textContent = state.searchInProgress ? t('searchStatusSearching') : t('searchStatusIdle');
    syncLyricsLabel();
    renderAll();
  }

  /* ===================== DOM / 事件 ===================== */
  const HOT_KEYWORDS = ['周杰伦','林俊杰','陈奕迅','邓紫棋','五月天','薛之谦','张杰','毛不易','告五人','抖音热歌','古风','说唱','电影原声','轻音乐'];

    dom.npCoverBig = $('npCoverBig');
    dom.npNameBig = $('npNameBig');
    dom.npArtistBig = $('npArtistBig');
    dom.npTagsBig = $('npTagsBig');
    dom.miniNp = $('miniNp');

    dom.resultList = $('resultList');
    dom.resultHint = $('resultHint');
    dom.resultSection = $('resultSection');
    dom.hotSection = $('hotSection');
    dom.searchPanel = $('searchPanel');

    dom.recommendList = $('recommendList');

    dom.hisList = $('hisList');

  const MODE_ICONS = {
    list:'<path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/>',
    single:'<path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/><text x="12" y="14" font-size="7" fill="currentColor" stroke="none" text-anchor="middle">1</text>'
  };
  function setPlayMode(mode){
    state.playMode = mode;
    if(dom.modeIcon) dom.modeIcon.innerHTML = MODE_ICONS[mode] || MODE_ICONS.list;
    if(dom.shuffleBtn) dom.shuffleBtn.classList.toggle('on', mode === 'shuffle');
    if(dom.modeBtn) dom.modeBtn.classList.toggle('on', mode !== 'shuffle');
  }

  function openPlModal(){
    dom.plModal.classList.add('show');
    dom.plNameInput.value = '';
    setTimeout(function(){ dom.plNameInput.focus(); }, 60);
  }
  function closePlModal(){ dom.plModal.classList.remove('show'); }

  function createPlaylist(){
    let name = dom.plNameInput.value.trim();
    if(!name) name = state.language === 'zh' ? '未命名歌单' : 'Untitled';
    const pl = {id:'pl-' + Date.now() + '-' + Math.random().toString(16).slice(2), name:name, tracks:[]};
    state.playlists.push(pl);
    state.playContext.playlistId = pl.id;
    saveLibrary();
    closePlModal();
    if(dom.plSelect) dom.plSelect.value = pl.id;
    renderPlaylistViews();
    showToast(t('toastPlCreated'));
  }

  function setupEvents(){
    $$('#nav a').forEach(function(a){
      a.addEventListener('click', function(ev){ ev.preventDefault(); switchView(a.dataset.view); });
    });

    if(dom.menuBtn) dom.menuBtn.addEventListener('click', openSidebar);
    if(dom.sideOverlay) dom.sideOverlay.addEventListener('click', closeSidebar);

    if(dom.miniNp) dom.miniNp.addEventListener('click', function(e){
      if(e.target.closest('button')) return;
      if(!state.currentTrack){ showToast(t('toastNoCurrent')); return; }
      switchView(state.view === 'nowplaying' ? state.lastListView : 'nowplaying');
    });
    if(dom.npBack) dom.npBack.addEventListener('click', function(){ switchView(state.lastListView || 'discover'); });

    function runSearch(){
      const kw = dom.searchInput.value.trim();
      if(!kw){ showToast(t('toastNeedKeyword')); return; }
      state.searchKeyword = kw;
      state.noMoreResults = false;
      openSearchPanel();
      searchAllSources(true);
    }
    dom.searchBtn.addEventListener('click', runSearch);
    dom.searchInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); runSearch(); }
    });
    /* 点开搜索框 → 展开面板（无输入显示热门搜索，有结果切换为结果列表） */
    dom.searchInput.addEventListener('focus', openSearchPanel);
    dom.searchInput.addEventListener('click', openSearchPanel);
    dom.searchPanel.addEventListener('mousedown', function(e){ e.preventDefault(); });
    document.addEventListener('mousedown', function(e){
      if(!state.searchPanelOpen) return;
      if(dom.searchWrap && dom.searchWrap.contains(e.target)) return;
      closeSearchPanel();
    });
    if(dom.refreshRecBtn) dom.refreshRecBtn.addEventListener('click', function(){ loadRecommendations(true); });
    dom.limitSelect.addEventListener('change', function(){
      state.perSourceLimit = parseInt(dom.limitSelect.value, 10) || 20;
    });
    dom.loadMoreBtn.addEventListener('click', requestMoreResults);

    $$('#sourceChips .chip').forEach(function(chip){
      const cb = chip.querySelector('input');
      if(!cb) return;
      cb.addEventListener('change', function(){
        state.enabledSources[cb.dataset.source] = cb.checked;
        chip.classList.toggle('on', cb.checked);
      });
    });

    if(dom.hotKeywords){
      dom.hotKeywords.innerHTML = HOT_KEYWORDS.map(function(k){
        return '<button class="kw-chip">' + esc(k) + '</button>';
      }).join('');
      $$('.kw-chip', dom.hotKeywords).forEach(function(btn){
        btn.addEventListener('click', function(){
          dom.searchInput.value = btn.textContent;
          state.searchKeyword = btn.textContent;
          state.noMoreResults = false;
          openSearchPanel();
          searchAllSources(true);
        });
      });
    }

    $('clearHistoryBtn2').addEventListener('click', clearHistory);
    $('clearFavBtn').addEventListener('click', clearFavorites);

    $('newPlBtn').addEventListener('click', openPlModal);
    $('plConfirm').addEventListener('click', createPlaylist);
    $('plCancel').addEventListener('click', closePlModal);
    dom.plModal.addEventListener('click', function(e){ if(e.target === dom.plModal) closePlModal(); });
    $('delPlBtn').addEventListener('click', function(){
      const plId = dom.plSelect.value;
      if(!plId){ showToast(t('toastNoPl')); return; }
      const idx = state.playlists.findIndex(function(p){ return p.id === plId; });
      if(idx < 0) return;
      if(!window.confirm(t('confirmDeletePl'))) return;
      state.playlists.splice(idx, 1);
      saveLibrary();
      renderAll();
      showToast(t('toastPlDeleted'));
    });
    $('addCurBtn').addEventListener('click', function(){
      if(!state.currentTrack){ showToast(t('toastNoCurrent')); return; }
      addTrackToPlaylist(state.currentTrack);
    });
    dom.plSelect.addEventListener('change', function(){
      state.playContext.playlistId = dom.plSelect.value;
      renderPlaylistViews();
    });

    $('importBtn').addEventListener('click', function(){ dom.importInput.click(); });
    dom.importInput.addEventListener('change', function(e){
      const input = e.target;
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const stat = importData(JSON.parse(reader.result));
          if(!stat.fav && !stat.pl && !stat.tracks && !stat.his){ showToast(t('toastPlImportEmpty')); }
          else showToast(t('toastPlImported') + '：+' + stat.pl + ' 歌单 / +' + stat.fav + ' 收藏 / +' + stat.his + ' 记录');
        }catch(err){
          console.error(err);
          showToast(t('toastPlImportError'));
        }finally{ input.value = ''; }
      };
      reader.onerror = function(){ showToast(t('toastPlImportError')); input.value = ''; };
      reader.readAsText(file, 'utf-8');
    });
    $('exportBtn').addEventListener('click', exportData);
    $('exportBtnFav').addEventListener('click', exportData);

    dom.playBtn.addEventListener('click', togglePlayPause);
    dom.prevBtn.addEventListener('click', function(){ playNext('prev'); });
    dom.nextBtn.addEventListener('click', function(){ playNext('next'); });
    dom.modeBtn.addEventListener('click', function(){
      const next = state.playMode === 'list' ? 'single' : 'list';
      setPlayMode(next);
      showToast(next === 'single' ? t('toastPlaymodeSingle') : t('toastPlaymodeList'));
    });
    dom.shuffleBtn.addEventListener('click', function(){
      setPlayMode(state.playMode === 'shuffle' ? 'list' : 'shuffle');
      showToast(state.playMode === 'shuffle' ? t('toastPlaymodeShuffle') : t('toastPlaymodeList'));
    });
    dom.favBtn.addEventListener('click', function(){ toggleFavorite(state.currentTrack); });
    dom.downloadBtn.addEventListener('click', function(){ downloadTrack(state.currentTrack); });
    dom.lyricsBtn.addEventListener('click', function(){
      if(!state.currentTrack){ showToast(t('toastNoCurrent')); return; }
      switchView(state.view === 'nowplaying' ? state.lastListView : 'nowplaying');
    });
    dom.muteBtn.addEventListener('click', function(){
      state.muted = !state.muted;
      dom.audio.muted = state.muted;
      dom.muteBtn.classList.toggle('on', state.muted);
    });
    dom.volTrack.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const v = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      dom.audio.volume = v;
      dom.volFill.style.width = (v * 100) + '%';
    });
    dom.pTrack.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dur = dom.audio.duration || 0;
      if(dur > 0) dom.audio.currentTime = dur * r;
    });

    dom.audio.addEventListener('timeupdate', function(){
      const cur = dom.audio.currentTime || 0;
      const dur = dom.audio.duration || 0;
      dom.curTime.textContent = formatTime(cur);
      dom.durTime.textContent = formatTime(dur);
      const pct = dur > 0 ? (cur / dur * 100) : 0;
      dom.pFill.style.width = pct + '%';
      dom.pThumb.style.left = pct + '%';
      if(dom.miniProgress) dom.miniProgress.style.width = pct + '%';
      updateLyricsHighlight(cur);
      maybeUpdateHistory(cur, dur);
    });
    dom.audio.addEventListener('play', function(){
      state.isPlaying = true;
      setPlayIcon(true);
      setPlayerStatus(t('playerStatusPlaying'));
      renderNowPlaying();
      renderRecommend();
    });
    dom.audio.addEventListener('pause', function(){
      state.isPlaying = false;
      setPlayIcon(false);
      setPlayerStatus(t('playerStatusPaused'));
      if(state.currentTrack) pushHistory(state.currentTrack, dom.audio.currentTime || 0, dom.audio.duration || 0);
      renderNowPlaying();
      renderRecommend();
    });
    dom.audio.addEventListener('ended', function(){
      if(state.currentTrack) pushHistory(state.currentTrack, 0, dom.audio.duration || 0);
      playNext('next');
    });
    dom.audio.addEventListener('error', function(){
      const stream = state.audioStream || [];
      state.audioStreamIndex = (state.audioStreamIndex || 0) + 1;
      if(state.audioStreamIndex < stream.length){
        const next = stream[state.audioStreamIndex];
        if(state.currentTrack && next.cand && next.cand.bitrate){
          applyKuwoQuality(state.currentTrack, next.cand);
          renderNowPlaying();
        }
        dom.audio.src = next.url;
        dom.audio.play().catch(function(){});
        return;
      }
      showToast(state.currentTrack && state.currentTrack.source === 'qq'
        ? t('toastQQUnavailable') : t('toastPlayError'));
      setPlayerStatus(t('playerStatusIdle'));
    });

    dom.themeBtn.addEventListener('click', function(){
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next, true);
    });
    dom.langBtn.addEventListener('click', function(){
      setLanguage(state.language === 'zh' ? 'en' : 'zh');
    });
    $('shortcutBtn').addEventListener('click', function(){ dom.scModal.classList.add('show'); });
    $('scClose').addEventListener('click', function(){ dom.scModal.classList.remove('show'); });
    dom.scModal.addEventListener('click', function(e){ if(e.target === dom.scModal) dom.scModal.classList.remove('show'); });

    // 搜索面板滚到底自动加载更多
    if(dom.searchPanel) dom.searchPanel.addEventListener('scroll', function(){
      if(!state.searchPanelOpen) return;
      if(state.searchInProgress || state.noMoreResults) return;
      const el = dom.searchPanel;
      if(el.scrollTop + el.clientHeight >= el.scrollHeight - 120) requestMoreResults();
    });

    document.addEventListener('keydown', function(e){
      const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
      const typing = (tag === 'input' || tag === 'textarea' || tag === 'select');
      const modalOpen = dom.plModal.classList.contains('show') || dom.scModal.classList.contains('show');

      if(e.key === 'Escape'){
        if(dom.plModal.classList.contains('show')) closePlModal();
        dom.scModal.classList.remove('show');
        if(state.searchPanelOpen){ closeSearchPanel(); dom.searchInput.blur(); }
        if(state.view === 'nowplaying') switchView(state.lastListView || 'discover');
        closeSidebar();
        return;
      }
      if(modalOpen || typing) return;

      if(e.code === 'Space'){ e.preventDefault(); togglePlayPause(); return; }
      if(e.key === 'ArrowRight'){ dom.audio.currentTime = (dom.audio.currentTime || 0) + 5; return; }
      if(e.key === 'ArrowLeft'){ dom.audio.currentTime = Math.max(0, (dom.audio.currentTime || 0) - 5); return; }
      if(e.key === 'ArrowUp'){ dom.audio.volume = Math.min(1, (dom.audio.volume || 0) + 0.05); dom.volFill.style.width = (dom.audio.volume * 100) + '%'; return; }
      if(e.key === 'ArrowDown'){ dom.audio.volume = Math.max(0, (dom.audio.volume || 0) - 0.05); dom.volFill.style.width = (dom.audio.volume * 100) + '%'; return; }
      if(e.key === 'n' || e.key === 'N'){ playNext('next'); return; }
      if(e.key === 'p' || e.key === 'P'){ playNext('prev'); return; }
      if(e.key === 'f' || e.key === 'F'){ toggleFavorite(state.currentTrack); return; }
      if(e.key === 'l' || e.key === 'L'){
        if(!state.currentTrack){ showToast(t('toastNoCurrent')); return; }
        switchView(state.view === 'nowplaying' ? state.lastListView : 'nowplaying');
        return;
      }
      if(e.key === 'm' || e.key === 'M'){
        state.muted = !state.muted;
        dom.audio.muted = state.muted;
        dom.muteBtn.classList.toggle('on', state.muted);
        return;
      }
      if(e.key === '/'){ e.preventDefault(); dom.searchInput.focus(); dom.searchInput.select(); }
    });
  }

  let lastHisWrite = 0;
  function maybeUpdateHistory(cur, dur){
    if(!state.currentTrack || !state.isPlaying) return;
    const now = Date.now();
    if(now - lastHisWrite < 5000) return;
    lastHisWrite = now;
    const head = state.history[0];
    if(head && head.uid === state.currentTrack.uid){
      head.position = cur;
      head.duration = dur || head.duration;
      head.playedAt = now;
      saveHistory();
    }
  }

  /* ===================== 初始化 ===================== */
  function init(){
    setupDOM();

    let theme = null;
    try{ theme = localStorage.getItem(THEME_STORAGE_KEY); }catch(e){}
    if(!theme){
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    setTheme(theme, false);

    let lang = 'zh';
    try{ lang = localStorage.getItem(LANG_STORAGE_KEY) || 'zh'; }catch(e){}
    state.language = (lang === 'en') ? 'en' : 'zh';

    loadLibrary();
    loadHistory();

    dom.audio.volume = 0.7;
    dom.volFill.style.width = '70%';

    setLanguage(state.language);
    setPlayMode('list');
    setupEvents();
    switchView('discover');
    renderLyrics();
    loadRecommendations(false);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
